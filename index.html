<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆきの自己紹介</title>
    <style>
        /* =========================================
           文字の色や背景色を変える場所
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f8ff; /* 背景色（ごく薄い青） */
            color: #333333; /* 全体の文字色（濃いグレー） */
            line-height: 1.6;
        }
        header {
            background-color: #0056b3; /* ヘッダーの背景色（濃い青） */
            color: #ffffff; /* ヘッダーの文字色（白） */
            padding: 20px;
            text-align: center;
        }
        nav {
            background-color: #004494; /* メニューの背景色（さらに濃い青） */
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #ffffff; /* メニューの文字色（白） */
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
            display: inline-block;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            box-sizing: border-box; /* 画面幅に収めるための設定 */
        }
        section {
            background-color: #ffffff; /* 各セクションの背景色（白） */
            padding: 20px 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0056b3; /* セクション見出しの文字色（濃い青） */
            border-bottom: 2px solid #f0f8ff;
            padding-bottom: 10px;
            margin-top: 0;
        }
        a.external-link {
            color: #0056b3; /* リンクの文字色（濃い青） */
            text-decoration: underline;
            word-break: break-all; /* 長いURLがはみ出さないための設定 */
        }
    </style>
</head>
<body>

<header>
    <h1>ゆきの自己紹介</h1>
</header>

<nav>
    <a href="#intro">自己紹介</a>
    <a href="#studying">今学んでいること</a>
    <a href="#future">これからやってみたいこと</a>
</nav>

<div class="container">
    
    <!-- 自己紹介セクション -->
    <section id="intro">
        <h2>自己紹介</h2>
        <!-- =========================================
             紹介文を変える場所（ここから）
             ========================================= -->
        <p>はじめまして！大学1年生のゆきです。</p>
        <p>同級生の皆さん、これからよろしくお願いします。</p>
        <p>私が皆さんに一番伝えたいことは「バドミントンの魅力」です。直接お話しする機会があれば、ぜひ語らせてください！</p>
        <!-- 紹介文を変える場所（ここまで） -->
        <p>
            参考リンク：<br>
            <a href="https://hp.brs.nihon-u.ac.jp/~NUBScommon/ClubCircle/1002200%E3%83%90%E3%83%89%E3%83%9F%E3%83%B3%E3%83%88%E3%83%B3%E9%83%A8Ducks.html" class="external-link" target="_blank" rel="noopener noreferrer">バドミントン部 Ducks 公式サイト</a>
        </p>
    </section>

    <!-- 今学んでいることセクション -->
    <section id="studying">
        <h2>今学んでいること</h2>
        <!-- =========================================
             紹介文を変える場所（ここから）
             ========================================= -->
        <p>現在は、情報系の勉強をしています。</p>
        <!-- 紹介文を変える場所（ここまで） -->
    </section>

    <!-- これからやってみたいことセクション -->
    <section id="future">
        <h2>これからやってみたいこと</h2>
        <!-- =========================================
             紹介文を変える場所（ここから）
             ========================================= -->
        <ul>
            <li>情報系の資格を取ること</li>
            <li>運転免許を取ること</li>
        </ul>
        <!-- 紹介文を変える場所（ここまで） -->
    </section>

</div>

</body>
</html>
